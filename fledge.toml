[tasks]
build = "./gradlew build"
test = "./gradlew test"
check = "./gradlew check"
jar = "./gradlew jar"
clean = "./gradlew clean"

[tasks.install]
cmd = "hooks/build.sh"
description = "Build and install the fledge plugin binary"

[lanes.verify]
description = "Full verification pipeline"
steps = ["build", "test"]

[lanes.ci]
description = "CI pipeline with build"
steps = ["verify", "jar"]

[lanes.pre-commit]
description = "Run before committing changes"
steps = ["build", "test"]
