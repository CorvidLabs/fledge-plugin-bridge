[tasks]
build = "./gradlew build"
test = "./gradlew test"
lint = "./gradlew ktlintCheck"
lint-fix = "./gradlew ktlintFormat"
check = "./gradlew check"
jar = "./gradlew jar"
clean = "./gradlew clean"

[tasks.install]
cmd = "hooks/build.sh"
description = "Build and install the fledge plugin binary"

[lanes.verify]
description = "Full verification pipeline"
steps = [{ parallel = ["lint", "check"] }, "test"]

[lanes.ci]
description = "CI pipeline with build"
steps = ["verify", "jar"]

[lanes.pre-commit]
description = "Run before committing changes"
steps = [{ parallel = ["lint", "check"] }, "test"]
