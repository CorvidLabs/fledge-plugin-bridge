[plugin]
name = "fledge-plugin-bridge"
version = "0.4.7"
description = "Bridge your local dev environment to corvid-agent via outbound WebSocket"
author = "CorvidLabs"
protocol = "fledge-v1"

[[commands]]
name = "bridge"
description = "Remote dev environment bridge: connect, status, disconnect"
binary = "bin/fledge-bridge"

[hooks]
build = "hooks/build.sh"

[capabilities]
exec = true
store = false
metadata = false
